  .preview-panel {

  .preview-immersion-float { position: sticky; bottom: 16px; text-align: center; margin-top: 16px; pointer-events: none; z-index: 10; }
  .preview-immersion-float .btn {
    pointer-events: auto; box-shadow: 0 4px 16px var(--shadow); padding: 10px 24px;
    font-size: 14px; border-radius: 24px; background: var(--accent); color: #fff; border-color: var(--accent);
  }
  .preview-immersion-float .btn:hover { background: var(--accent-dark); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(74,124,89,0.3); }

  .markdown-body { max-width: 800px; margin: 0 auto; font-size: 15px; color: var(--text-primary); transform-origin: top center; }
  .markdown-body h1,.markdown-body h2,.markdown-body h3,.markdown-body h4 { color: var(--text-primary); font-weight: 600; line-height: 1.4; margin-top: 1.6em; margin-bottom: 0.6em; }
  .markdown-body h1 { font-size: 1.8em; border-bottom: 1px solid var(--border-color); padding-bottom: 0.3em; }
  .markdown-body h2 { font-size: 1.5em; border-bottom: 1px solid var(--border-color); padding-bottom: 0.2em; }
  .markdown-body h3 { font-size: 1.25em; } .markdown-body h4 { font-size: 1.1em; }
  .markdown-body p { margin-bottom: 1em; }
  .markdown-body a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
  .markdown-body a:hover { color: var(--accent-light); }
  .markdown-body strong { font-weight: 700; } .markdown-body em { font-style: italic; }
  .markdown-body ul,.markdown-body ol { margin-bottom: 1em; padding-left: 2em; }
  .markdown-body li { margin-bottom: 0.3em; }
  .markdown-body blockquote {
    margin: 1em 0; padding: 0.8em 1.2em; border-left: 4px solid var(--accent);
    background: var(--bg-card); border-radius: 0 8px 8px 0; color: var(--text-secondary);
  }
  .markdown-body code {
    font-family: 'JetBrains Mono','Fira Code','Consolas',monospace;
    font-size: 0.88em; padding: 0.2em 0.4em; background: var(--bg-code); border-radius: 4px; color: var(--text-primary);
  }

  /* ===== 行内代码点击复制 ===== */
  .inline-code-wrapper {
    position: relative; display: inline-flex; align-items: center;
    background: var(--bg-code); border-radius: 4px; padding: 0.2em 0.4em;
    margin: 0 0.1em;
    cursor: pointer;
    transition: background-color 0.2s ease;
    user-select: none;
  }
  .inline-code-wrapper:hover {
    background: var(--accent-light);
  }
  .inline-code-wrapper code {
    background: none; padding: 0; margin-right: 0;
  }
  .markdown-body pre {
    margin: 1em 0; padding: 16px 20px; background: var(--bg-card);
    border: 1px solid var(--border-color); border-radius: 8px; overflow-x: auto;
  }
  .markdown-body pre code { background: none; padding: 0; font-size: 0.88em; line-height: 1.6; color: var(--text-primary); }

  /* ===== 代码块复制按钮 ===== */
  .code-block-wrapper {
    position: relative; margin: 1em 0;
  }
  .code-copy-btn {
    position: absolute; top: 8px; right: 8px;
    width: 32px; height: 32px; border-radius: 6px;
    background: var(--bg-primary); border: 1px solid var(--border-color);
    color: var(--text-muted); font-size: 14px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: all 0.2s ease; z-index: 5;
    backdrop-filter: blur(4px);
  }
  .code-block-wrapper:hover .code-copy-btn { opacity: 0.7; }
  .code-copy-btn:hover { opacity: 1 !important; background: var(--accent); color: #fff; border-color: var(--accent); }
  .code-copy-btn.copied { background: var(--accent); color: #fff; border-color: var(--accent); opacity: 1 !important; }
  .markdown-body hr { border: none; border-top: 1px solid var(--border-color); margin: 1.5em 0; }
  .markdown-body table { width: 100%; border-collapse: collapse; margin: 1em 0; }
  .markdown-body th,.markdown-body td { padding: 8px 12px; border: 1px solid var(--border-color); text-align: left; }
  .markdown-body th { background: var(--bg-card); font-weight: 600; }
  .markdown-body tr:nth-child(even) { background: var(--bg-card); }
  .markdown-body img { max-width: 100%; border-radius: 8px; margin: 0.5em 0; }
  .markdown-body input[type=&quot;checkbox&quot;] { accent-color: var(--accent); margin-right: 6px; }

  .mermaid-wrapper {
    position: relative; margin: 1.2em 0; padding: 12px;
    background: var(--bg-card); border: 1px solid var(--border-color);
    border-radius: 12px; overflow: hidden; transition: border-color 0.3s ease, box-shadow 0.3s ease;
  }
  .mermaid-wrapper:hover { border-color: var(--accent); box-shadow: 0 2px 12px rgba(74,124,89,0.15); }
  .mermaid-chart-placeholder {
    display: flex; justify-content: center; align-items: center;
    min-height: 60px; overflow-x: auto;
  }
  .mermaid-chart-placeholder svg { max-width: 100%; height: auto; }

  .mermaid-fullscreen-btn {
    position: absolute; top: 6px; right: 6px;
    width: 30px; height: 30px; border-radius: 6px;
    background: var(--bg-primary); border: 1px solid var(--border-color);
    color: var(--text-muted); font-size: 14px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: all 0.25s ease; z-index: 5; backdrop-filter: blur(4px);
  }
  .mermaid-wrapper:hover .mermaid-fullscreen-btn { opacity: 0.8; }
  .mermaid-fullscreen-btn:hover { opacity: 1 !important; background: var(--accent); color: #fff; border-color: var(--accent); }

  .mermaid-modal {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(0,0,0,0.55); z-index: 999999;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.3s ease;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  .mermaid-modal.active { display: flex; opacity: 1; }

  .mermaid-modal-content {
    position: relative; width: 95vw; height: 92vh;
    background: var(--bg-card); border: 1px solid var(--border-color);
    border-radius: 14px; padding: 40px 28px 28px 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden;
    transform: scale(0.92); transition: transform 0.3s ease;
  }
  .mermaid-modal.active .mermaid-modal-content { transform: scale(1); }

  /* 全屏弹窗内部的容器 - 覆盖全局 .mermaid-chart-placeholder 样式 */
  #mermaidModalDiagram {
    position: relative !important;
    overflow: hidden !important;
    cursor: grab !important;
    user-select: none !important;
    width: 100% !important;
    height: 100% !important;
    min-width: 0 !important;
    min-height: 0 !important;
    display: block !important;
  }
  #mermaidModalDiagram.dragging { cursor: grabbing !important; }
  /* SVG 在弹窗中采用绝对定位，由 JS 控制 transform */
  #mermaidModalDiagram &gt; svg {
    position: absolute;
    top: 0; left: 0;
    width: auto; height: auto;
    max-width: none; max-height: none;
    transform-origin: 0 0;
    will-change: transform;
  }
  /* 确保弹窗中的 SVG 初始可见，避免 overflow:hidden 将图片完全裁掉 */
  #mermaidModalDiagram &gt; svg.initial-visible {
    position: static !important;
    width: 100% !important;
    height: auto !important;
    max-width: 100% !important;
    max-height: 100% !important;
    object-fit: contain !important;
  }

  .mermaid-modal-close {
    position: absolute; top: 10px; right: 10px;
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--bg-primary); border: 1px solid var(--border-color);
    color: var(--text-primary); font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.25s ease; z-index: 10;
  }
  .mermaid-modal-close:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

  .mermaid-modal-label { position: absolute; top: 14px; left: 20px; font-size: 11px; color: var(--text-muted); font-weight: 500; letter-spacing: 0.5px; }
  .mermaid-modal-zoom-indicator { position: absolute; bottom: 12px; right: 14px; font-size: 12px; font-weight: 600; color: var(--text-muted); background: var(--bg-primary); padding: 2px 10px; border-radius: 8px; border: 1px solid var(--border-color); z-index: 10; opacity: 0.8; pointer-events: none; }

  .immersion-overlay {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: var(--bg-primary); color: var(--text-primary);
    z-index: 9999; display: none;
    flex-direction: column; overflow: hidden; opacity: 0;
    transition: opacity 0.4s ease;
  }
  .immersion-overlay.active { display: flex; opacity: 1; }
  .immersion-toolbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 24px; background: var(--bg-secondary);
    border-bottom: 1px solid var(--border-color); flex-shrink: 0;
    position: relative;
  }
  .immersion-toolbar .btn { background: transparent; }
  .immersion-toolbar .btn:hover { background: var(--accent); }
  .immersion-info { font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 8px; }
  .immersion-content {
    flex: 1; overflow: auto; padding: 48px 10%;
    color: var(--text-primary); background: transparent;
    position: relative;
  }
  .immersion-content .markdown-body { max-width: 720px; margin: 0 auto; font-size: 18px; line-height: 2; color: var(--text-primary); }
  .immersion-content .markdown-body h1 { font-size: 2.2em; }
  .immersion-content .markdown-body h2 { font-size: 1.8em; }
  .immersion-content .markdown-body h3 { font-size: 1.4em; }
  .immersion-content .markdown-body p { margin-bottom: 1.4em; }
  .immersion-content .markdown-body blockquote { font-size: 1.1em; padding: 1em 1.6em; }
  .immersion-content .markdown-body pre { font-size: 0.9em; padding: 20px 24px; }
  .immersion-progress { position: absolute; top: 0; left: 0; height: 3px; background: var(--accent); width: 0%; transition: width 0.1s linear; z-index: 1; }

  #themeSelect option { background: var(--bg-card); color: var(--text-primary); }

  .zoom-controls { display: flex; align-items: center; gap: 6px; }
  .zoom-controls .zoom-indicator { font-size: 12px; font-weight: 600; color: var(--accent); min-width: 42px; text-align: center; font-variant-numeric: tabular-nums; }
  .zoom-controls .btn { font-size: 14px; font-weight: 600; }

  .empty-hint { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-muted); font-size: 14px; gap: 8px; opacity: 0.6; }
  .empty-hint .icon { font-size: 36px; }

  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--text-primary); color: var(--bg-primary); padding: 10px 24px;
    border-radius: 8px; font-size: 13px; font-weight: 500; opacity: 0;
    transition: all 0.3s ease; z-index: 99999; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .zoom-flash {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: var(--text-primary); color: var(--bg-primary); padding: 12px 28px;
    border-radius: 12px; font-size: 24px; font-weight: 700; opacity: 0;
    pointer-events: none; z-index: 999999; transition: opacity 0.15s ease; box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  }
  .zoom-flash.show { opacity: 0.9; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .markdown-body &gt; * { animation: fadeIn 0.3s ease forwards; }
  .markdown-body &gt; *:nth-child(1) { animation-delay: 0.02s; }
  .markdown-body &gt; *:nth-child(2) { animation-delay: 0.04s; }
  .markdown-body &gt; *:nth-child(3) { animation-delay: 0.06s; }

  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .immersion-overlay.active .immersion-content { animation: slideUp 0.5s ease forwards; }

  .scroll-top-btn {
    position: fixed; bottom: 80px; right: 20px; width: 40px; height: 40px; border-radius: 50%;
    background: var(--accent); color: #fff; border: none; font-size: 18px; cursor: pointer;
    opacity: 0; transition: all 0.3s ease; z-index: 100; box-shadow: 0 2px 12px var(--shadow); display: none;
  }
  .scroll-top-btn.visible { opacity: 0.8; display: block; }
  .scroll-top-btn.visible:hover { opacity: 1; transform: translateY(-2px); }

  /* ===== 沉浸内容容器 - 为退出按钮留出右侧空间 ===== */
  .immersion-content-inner {
    max-width: 768px; margin: 0 auto;
    display: flex; align-items: flex-start;
    padding-right: 48px; /* 为右侧的 sticky X 按钮预留空间 */
    position: relative;
  }
  .immersion-content-inner .markdown-body {
    flex: 1; min-width: 0;
  }
  /* ===== 退出按钮 - sticky 固定在右侧，紧贴文本但不重叠 ===== */
  .immersion-content-exit {
    position: sticky; top: 20px; z-index: 10;
    flex-shrink: 0; width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border-color);
    font-size: 16px; font-weight: 700; cursor: pointer; line-height: 36px; text-align: center;
    transition: all 0.2s ease; opacity: 0.7;
    margin-top: 4px; margin-left: 8px;
  }
  .immersion-content-exit:hover { background: #c0392b; color: #fff; border-color: #c0392b; opacity: 1; }

  @media (max-width: 768px) {
    .main-area { flex-direction: column; }
    .editor-panel { border-right: none; border-bottom: 1px solid var(--border-color); max-height: 40vh; }
    #modeLabel { display: none; }
    .preview-panel { padding: 16px; } .toolbar { padding: 8px 12px; }
    .immersion-content { padding: 24px 5%; } .immersion-content .markdown-body { font-size: 16px; }
    .toolbar-title { font-size: 14px; }
    .immersion-toolbar { padding: 10px 16px; flex-wrap: wrap; gap: 8px; }
    .preview-immersion-float .btn { padding: 8px 18px; font-size: 13px; }
    .zoom-controls .zoom-indicator { min-width: 36px; font-size: 11px; }
    .mermaid-modal-content { width: 95vw; height: 88vh; padding: 36px 16px 16px 16px; }
    .immersion-content-inner { padding-right: 0; }
    .immersion-content-exit {
      position: fixed; top: auto; bottom: 20px; right: 20px;
      margin: 0;
      box-shadow: 0 4px 16px var(--shadow);
      width: 44px; height: 44px; line-height: 44px; font-size: 18px;
      background: var(--accent); color: #fff; border-color: var(--accent);
      opacity: 0.9;
    }
  }
  @media (max-width: 480px) {
    .btn span.label { display: none; } .preview-panel { padding: 12px; }
    .editor-textarea { padding: 12px; font-size: 13px; }
  }

  .mermaid-error {
    padding: 20px; text-align: center; color: var(--text-muted);
    font-size: 13px; font-style: italic;
  }
  .mermaid-loading {
    padding: 20px; text-align: center; color: var(--text-muted);
    font-size: 13px;
  }

  /* Mermaid source text container - hidden visually but read by mermaid.run() */
  .mermaid-source-data {
    display: none;
  }

&lt;div class=&quot;zoom-flash&quot; id=&quot;zoomFlash&quot;&gt;100%&lt;/div&gt;
&lt;div class=&quot;toast&quot; id=&quot;toast&quot;&gt;&lt;/div&gt;

&lt;script&gt;
(function() {
  'use strict';

  // ===== DOM 引用 =====
  const editor = document.getElementById('editor');
  const preview = document.getElementById('preview');
  const immersionPreview = document.getElementById('immersionPreview');
  const immersionOverlay = document.getElementById('immersionOverlay');
  const immersionContent = document.getElementById('immersionContent');
  const immersionProgress = document.getElementById('immersionProgress');
  const wordCountEl = document.getElementById('immersionWordCount');
  const immersionBtn = document.getElementById('immersionBtn');
  const previewImmersionBtn = document.getElementById('previewImmersionBtn');
  // const loadSampleBtn = document.getElementById('loadSampleBtn');
  // const clearBtn = document.getElementById('clearBtn');
  const toastEl = document.getElementById('toast');
  const zoomInBtn = document.getElementById('zoomInBtn');
  const zoomOutBtn = document.getElementById('zoomOutBtn');
  const zoomResetBtn = document.getElementById('zoomResetBtn');
  const zoomIndicator = document.getElementById('zoomIndicator');
  const zoomFlash = document.getElementById('zoomFlash');
  const scrollTopBtn = document.getElementById('scrollTopBtn');
  const immersionContentExit = document.getElementById('immersionContentExit');
  const charCountEl = document.getElementById('charCount');
  const mermaidModal = document.getElementById('mermaidModal');
  const mermaidModalDiagram = document.getElementById('mermaidModalDiagram');
  const mermaidModalClose = document.getElementById('mermaidModalClose');
  const mermaidModalZoom = document.getElementById('mermaidModalZoom');

  // ===== 状态 =====
  let isImmersion = false;
  let zoomLevel = 100;
  let mermaidModalZoomLevel = 100;
  let toastTimer = null;
  let zoomFlashTimer = null;
  let mermaidIdCounter = 0;
  let mermaidReady = false;

  // ===== 工具函数 =====
  function escapeHtml(str) {
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
  }

  // ===== Mermaid 初始化 =====
  function initMermaid() {
    try {
      if (typeof mermaid !== 'undefined' &amp;&amp; mermaid &amp;&amp; mermaid.initialize) {
        mermaid.initialize({
          startOnLoad: false,
          securityLevel: 'loose',
          theme: 'base',
          themeVariables: {
            background: 'transparent',
            primaryColor: '#4A7C59',
            secondaryColor: '#B8D9BE',
            tertiaryColor: '#D4F0D8',
            primaryBorderColor: '#4A7C59',
            secondaryBorderColor: '#A8C8AD',
            tertiaryBorderColor: '#A8C8AD',
            lineColor: '#4A7C59',
            textColor: '#2C3E2D',
            mainBkg: '#D4F0D8',
            nodeBorder: '#4A7C59',
            clusterBkg: '#E2F5E5',
            clusterBorder: '#A8C8AD',
            titleColor: '#2C3E2D',
            edgeLabelBackground: '#D4F0D8',
            nodeTextColor: '#2C3E2D',
          },
          flowchart: { useMaxWidth: true, htmlLabels: true, curve: 'basis' },
          sequence: { showSequenceNumbers: false },
        });
        mermaidReady = true;
      }
    } catch(e) {
      console.warn('Mermaid init:', e);
      mermaidReady = false;
    }
  }
  initMermaid();

  // ===== Markdown 自定义渲染器（核心修复：直接拦截 mermaid 代码块） =====
  var renderer = new marked.Renderer();
  var originalCodeRenderer = renderer.code;

  renderer.code = function(code, language) {
    var text = code;
    var lang = language || '';

    if (lang === 'mermaid') {
      var id = 'mermaid-' + (++mermaidIdCounter);
      var escapedText = escapeHtml(text);
      return '&lt;div class=&quot;mermaid-wrapper&quot; id=&quot;' + id + '&quot;&gt;' +
        '&lt;button class=&quot;mermaid-fullscreen-btn&quot; data-mermaid-target=&quot;' + id + '&quot; title=&quot;全屏查看&quot;&gt;⛶&lt;/button&gt;' +
        '&lt;div class=&quot;mermaid-chart-placeholder&quot; id=&quot;' + id + '-chart&quot;&gt;&lt;/div&gt;' +
        '&lt;pre class=&quot;mermaid-source-data&quot;&gt;' + escapedText + '&lt;/pre&gt;' +
        '&lt;/div&gt;';
    }

    var langAttr = lang ? ' class=&quot;language-' + escapeHtml(lang) + '&quot;' : '';
    return '&lt;div class=&quot;code-block-wrapper&quot;&gt;' +
        '&lt;button class=&quot;code-copy-btn&quot; title=&quot;复制代码&quot;&gt;📋&lt;/button&gt;' +
        '&lt;pre&gt;&lt;code' + langAttr + '&gt;' + escapeHtml(text) + '&lt;/code&gt;&lt;/pre&gt;' +
        '&lt;/div&gt;';
  };

  marked.use({ renderer: renderer });
  marked.setOptions({ breaks: true, gfm: true });

  // ===== Toast =====
  function showToast(msg) {
    if (toastTimer) clearTimeout(toastTimer);
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    toastTimer = setTimeout(function() { toastEl.classList.remove('show'); }, 2000);
  }

  // ===== 沉浸模式缩放（像浏览器缩放一样撑开内容区） =====
  const immersionContentInner = document.querySelector('.immersion-content-inner');
  function applyZoom(level) {
    zoomLevel = Math.min(200, Math.max(50, level));
    var scale = zoomLevel / 100;

    // 用 CSS zoom 缩放文字（不破坏 sticky 定位）
    immersionPreview.style.zoom = zoomLevel + '%';

    // 随缩放比例动态增加容器 max-width，让内容填满可用宽度
    var baseMaxWidth = 768;
    immersionContentInner.style.maxWidth = Math.round(baseMaxWidth * scale) + 'px';
    immersionContentInner.style.width = '';  // 清除之前 transform 方案遗留的宽度
    immersionContentInner.style.transform = 'none';  // 清除 transform

    // 缩小 padding 以减少空白浪费
    var basePadV = 48;
    var scaledPadV = Math.max(12, Math.round(basePadV / scale));
    var basePadH = 10;
    var scaledPadH = Math.max(1, Math.round(basePadH / scale));
    immersionContent.style.padding = scaledPadV + 'px ' + scaledPadH + '%';

    // 退出按钮也一起缩放
    immersionContentExit.style.zoom = zoomLevel + '%';

    zoomIndicator.textContent = zoomLevel + '%';
  }
  function showZoomFlash(level) {
    if (zoomFlashTimer) clearTimeout(zoomFlashTimer);
    zoomFlash.textContent = level + '%';
    zoomFlash.classList.add('show');
    zoomFlashTimer = setTimeout(function() { zoomFlash.classList.remove('show'); }, 600);
  }
  function zoomIn() {
    var rect = immersionContent.getBoundingClientRect();
    var mouseX = rect.width / 2;
    var mouseY = rect.height / 2;
    var l = Math.min(200, zoomLevel + 10);
    applyZoom(l, mouseX, mouseY);
    showZoomFlash(zoomLevel);
    showToast('🔍 已放大: ' + zoomLevel + '%');
  }
  function zoomOut() {
    var rect = immersionContent.getBoundingClientRect();
    var mouseX = rect.width / 2;
    var mouseY = rect.height / 2;
    var l = Math.max(50, zoomLevel - 10);
    applyZoom(l, mouseX, mouseY);
    showZoomFlash(zoomLevel);
    showToast('🔍 已缩小: ' + zoomLevel + '%');
  }
  function zoomReset() {
    applyZoom(100);
    immersionContent.scrollLeft = 0;
    immersionContent.scrollTop = 0;
    showZoomFlash(100);
    showToast('🔍 已重置为 100%');
  }

  // ===== 渲染 Mermaid 图表 =====
  function renderMermaidDiagrams(container) {
    if (!mermaidReady) return;

    var wrappers = container.querySelectorAll('.mermaid-wrapper');
    var pending = [];

    for (var i = 0; i &lt; wrappers.length; i++) {
      var wrapper = wrappers[i];
      if (wrapper.getAttribute('data-mermaid-rendered') === 'true') continue;
      var pre = wrapper.querySelector('pre.mermaid-source-data');
      if (!pre) continue;
      var text = (pre.textContent || '').trim();
      if (!text) continue;
      pre.setAttribute('data-mermaid-src', text);
      pending.push({ wrapper: wrapper, pre: pre, text: text });
    }

    if (pending.length === 0) return;

    pending.forEach(function(item) {
      var id = 'mm-' + (++mermaidIdCounter);
      mermaid.render(id, item.text).then(function(result) {
        var chartContainer = item.wrapper.querySelector('.mermaid-chart-placeholder');
        if (chartContainer) {
          chartContainer.innerHTML = result.svg;
        }
        item.wrapper.setAttribute('data-mermaid-rendered', 'true');
      }).catch(function(err) {
        console.warn('Mermaid error:', err);
        var chartContainer = item.wrapper.querySelector('.mermaid-chart-placeholder');
        if (chartContainer) {
          chartContainer.innerHTML = '&lt;div class=&quot;mermaid-error&quot;&gt;⚠️ 图表渲染失败: ' + escapeHtml(err.message || '') + '&lt;/div&gt;';
        }
        item.wrapper.setAttribute('data-mermaid-rendered', 'true');
      });
    });
  }

  // ===== Markdown 渲染 =====
  function renderMarkdown(text) {
    if (!text || text.trim() === '') {
      return '&lt;div class=&quot;empty-hint&quot;&gt;&lt;span class=&quot;icon&quot;&gt;📝&lt;/span&gt;&lt;span&gt;输入 Markdown 内容后预览&lt;/span&gt;&lt;/div&gt;';
    }
    try {
      return marked.parse(text);
    } catch (e) {
      return '&lt;p style=&quot;color:#c0392b;&quot;&gt;⚠️ 渲染错误: ' + escapeHtml(e.message || '') + '&lt;/p&gt;';
    }
  }

  function updatePreview() {
    var content = editor.value;
    var html = renderMarkdown(content);
    preview.innerHTML = html;
    immersionPreview.innerHTML = html;
    var len = content.length;
    charCountEl.textContent = len + ' 字符';
    var words = content.replace(/\s/g, '').length;
    wordCountEl.textContent = '| ' + words + ' 字';
    if (mermaidReady) {
      setTimeout(function() {
        renderMermaidDiagrams(preview);
        renderMermaidDiagrams(immersionPreview);
      }, 100);
    }
    // 为行内代码添加复制按钮
    setTimeout(addInlineCodeCopyButtons, 50);
  }

  // ===== 行内代码复制按钮辅助函数 =====
  function addInlineCodeCopyButtons() {
    var bodies = [preview, immersionPreview];
    bodies.forEach(function(body) {
      if (!body) return;
      var codes = body.querySelectorAll('code');
      codes.forEach(function(code) {
        // 跳过代码块里的 code
        if (code.closest('pre') || code.closest('.mermaid-wrapper')) return;
        // 跳过已经包裹的
        if (code.parentElement &amp;&amp; code.parentElement.classList.contains('inline-code-wrapper')) return;
        
        var text = code.textContent;
        var wrapper = document.createElement('span');
        wrapper.className = 'inline-code-wrapper';
        wrapper.setAttribute('data-inline-code', text);
        wrapper.title = '点击复制';
        
        var codeClone = code.cloneNode(true);
        wrapper.appendChild(codeClone);
        
        code.parentNode.replaceChild(wrapper, code);
      });
    });
  }

  var debounceTimer = null;
  function debouncedUpdate() {
    if (debounceTimer) clearTimeout(debounceTimer);
    debounceTimer = setTimeout(updatePreview, 200);
  }

  // ===== Mermaid 全屏弹窗（左键拖拽 + Ctrl+滚轮以鼠标位置缩放） =====
  function openMermaidFullscreen(chartId) {
    var sourceEl = document.getElementById(chartId);
    if (!sourceEl) {
      var wrapper = document.querySelector('[data-mermaid-id=&quot;' + chartId + '&quot;]');
      if (wrapper) sourceEl = wrapper.querySelector('.mermaid-chart-placeholder');
    }
    if (!sourceEl) return;
    var srcSvg = sourceEl.querySelector('svg');
    if (!srcSvg) { showToast('⚠️ 图表尚未渲染完成'); return; }

    // 克隆 SVG
    var svg = srcSvg.cloneNode(true);
    // 清空容器，用 display:block 覆盖 flex 居中
    mermaidModalDiagram.innerHTML = '';
    mermaidModalDiagram.style.display = 'block';
    // 先以 static 方式放入 SVG，确保可见（避免 overflow:hidden 裁掉图片）
    svg.classList.add('initial-visible');
    mermaidModalDiagram.appendChild(svg);
    mermaidModal.classList.add('active');
    document.body.style.overflow = 'hidden';

    // 解析 SVG 自然尺寸（从 viewBox 或 width/height）
    var vb = svg.getAttribute('viewBox') || '';
    var vbParts = vb.split(/\s+/).filter(function(s) { return s.length &gt; 0; });
    var naturalW, naturalH;
    if (vbParts.length &gt;= 4) {
      naturalW = parseFloat(vbParts[2]);
      naturalH = parseFloat(vbParts[3]);
    } else {
      naturalW = parseFloat(svg.getAttribute('width')) || 800;
      naturalH = parseFloat(svg.getAttribute('height')) || 600;
    }

    // 状态变量
    var modalZoom = 100;
    var tx = 0, ty = 0;

    function applyTransform() {
      // 移除 initial-visible 类，切换到绝对定位模式
      svg.classList.remove('initial-visible');
      var scale = modalZoom / 100;
      svg.style.transform = 'translate(' + tx + 'px, ' + ty + 'px) scale(' + scale + ')';
      svg.style.transformOrigin = '0 0';
      mermaidModalZoom.textContent = modalZoom + '%';
    }

    function centerSvg() {
      var cw = mermaidModalDiagram.clientWidth;
      var ch = mermaidModalDiagram.clientHeight;
      if (cw &gt; 0 &amp;&amp; ch &gt; 0) {
        tx = (cw - naturalW) / 2;
        ty = (ch - naturalH) / 2;
      } else {
        tx = 0; ty = 0;
      }
      applyTransform();
    }

    // 先等一帧让布局稳定，再切换到绝对定位模式
    requestAnimationFrame(function() {
      requestAnimationFrame(centerSvg);
    });

    // === 左键拖拽 ===
    var isDown = false;
    var startX, startY, startTx, startTy;

    function onDown(e) {
      if (e.button !== 0) return;
      isDown = true;
      mermaidModalDiagram.classList.add('dragging');
      startX = e.clientX;
      startY = e.clientY;
      startTx = tx;
      startTy = ty;
      e.preventDefault();
    }
    function onMove(e) {
      if (!isDown) return;
      e.preventDefault();
      tx = startTx + (e.clientX - startX);
      ty = startTy + (e.clientY - startY);
      applyTransform();
    }
    function onUp() {
      isDown = false;
      mermaidModalDiagram.classList.remove('dragging');
    }
    mermaidModalDiagram.addEventListener('mousedown', onDown);
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);

    // === Ctrl+滚轮以鼠标位置缩放（地图式） ===
    function onWheel(e) {
      if (!(e.ctrlKey || e.metaKey)) return;
      e.preventDefault();

      var rect = mermaidModalDiagram.getBoundingClientRect();
      var mx = e.clientX - rect.left;
      var my = e.clientY - rect.top;

      var oldZoom = modalZoom;
      var delta = e.deltaY &gt; 0 ? -10 : 10;
      modalZoom = Math.min(300, Math.max(50, modalZoom + delta));

      // 鼠标在内容坐标系中的位置
      var contentX = (mx - tx) / (oldZoom / 100);
      var contentY = (my - ty) / (oldZoom / 100);
      // 缩放后使该内容点仍在鼠标下方
      tx = mx - contentX * (modalZoom / 100);
      ty = my - contentY * (modalZoom / 100);

      applyTransform();
    }
    document.addEventListener('wheel', onWheel, { passive: false });

    // === 窗口 resize 重新居中 ===
    var resizeTimer;
    function onResize() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(centerSvg, 100);
    }
    window.addEventListener('resize', onResize);

    // === 清理 ===
    svg._cleanup = function() {
      mermaidModalDiagram.removeEventListener('mousedown', onDown);
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.removeEventListener('wheel', onWheel);
      window.removeEventListener('resize', onResize);
      svg.style.transform = '';
      svg.style.transformOrigin = '';
      mermaidModalDiagram.style.display = '';
    };
  }

  function closeMermaidFullscreen() {
    var svg = mermaidModalDiagram.querySelector('svg');
    if (svg &amp;&amp; svg._cleanup) {
      svg._cleanup();
    }
    mermaidModalDiagram.innerHTML = '';
    mermaidModal.classList.remove('active');
    document.body.style.overflow = isImmersion ? 'hidden' : '';
  }

  // ===== 沉浸式阅读 =====
  function enterImmersion() {
    var content = editor.value;
    if (!content.trim()) { showToast('⚠️ 请先输入一些 Markdown 内容'); return; }
    updatePreview();
    applyZoom(zoomLevel);
    immersionContent.scrollLeft = 0;
    immersionContent.scrollTop = 0;
    immersionOverlay.classList.add('active');
    isImmersion = true;
    document.body.style.overflow = 'hidden';
    updateImmersionProgress();
  }
  function exitImmersion() {
    immersionOverlay.classList.remove('active');
    isImmersion = false;
    document.body.style.overflow = '';
    scrollTopBtn.classList.remove('visible');
  }

  function updateImmersionProgress() {
    if (!isImmersion) return;
    var scrollTop = immersionContent.scrollTop;
    var scrollHeight = immersionContent.scrollHeight - immersionContent.clientHeight;
    var progress = scrollHeight &gt; 0 ? (scrollTop / scrollHeight) * 100 : 0;
    immersionProgress.style.width = Math.min(100, progress) + '%';
    if (scrollTop &gt; 300) scrollTopBtn.classList.add('visible');
    else scrollTopBtn.classList.remove('visible');
  }
  function scrollToTop() { immersionContent.scrollTo({ top: 0, behavior: 'smooth' }); }

  // ===== 主题切换 =====
  const themeSelect = document.getElementById('themeSelect');

  const THEMES = {
    green: {
      bg: '#C7EDCC', bs: '#B8D9BE', bc: '#D4F0D8', bco: '#E2F5E5',
      tp: '#2C3E2D', ts: '#4A5D4B', tm: '#6B7F6C', bo: '#A8C8AD',
      ac: '#4A7C59', ad: '#3A6347', al: '#6B9F7A', sh: 'rgba(60,80,60,0.12)'
    },
    warm: {
      bg: '#F5ECD7', bs: '#EBDFC5', bc: '#F8F0DF', bco: '#FBF5E8',
      tp: '#4A3F2D', ts: '#6B5D45', tm: '#8B7D65', bo: '#D4C9B0',
      ac: '#A67C52', ad: '#8B6345', al: '#C49A6C', sh: 'rgba(120,100,70,0.12)'
    },
    sky: {
      bg: '#D6E8F0', bs: '#C4D8E6', bc: '#E2F0F8', bco: '#EFF6FB',
      tp: '#2C3E4A', ts: '#4A5D6B', tm: '#6B7F8C', bo: '#B0C8D8',
      ac: '#4A7C9F', ad: '#3A6380', al: '#6B9FC4', sh: 'rgba(60,80,100,0.12)'
    },
    lavender: {
      bg: '#E6DCF0', bs: '#D8CCE6', bc: '#F0E8F8', bco: '#F5EFFB',
      tp: '#3A2D4A', ts: '#5B4D6B', tm: '#7D6B8C', bo: '#C8B8D8',
      ac: '#7C5A9F', ad: '#634A80', al: '#9C7AC4', sh: 'rgba(80,60,100,0.12)'
    },
    apricot: {
      bg: '#F0E2D6', bs: '#E6D4C4', bc: '#F8ECE2', bco: '#FBF3EB',
      tp: '#4A382D', ts: '#6B5545', tm: '#8B7260', bo: '#D4C0B0',
      ac: '#B07A52', ad: '#8F6240', al: '#D0986C', sh: 'rgba(120,80,50,0.12)'
    }
  };

  function applyTheme(themeKey) {
    var t = THEMES[themeKey] || THEMES.green;
    var root = document.documentElement;
    root.style.setProperty('--bg-primary', t.bg);
    root.style.setProperty('--bg-secondary', t.bs);
    root.style.setProperty('--bg-card', t.bc);
    root.style.setProperty('--bg-code', t.bco);
    root.style.setProperty('--text-primary', t.tp);
    root.style.setProperty('--text-secondary', t.ts);
    root.style.setProperty('--text-muted', t.tm);
    root.style.setProperty('--border-color', t.bo);
    root.style.setProperty('--accent', t.ac);
    root.style.setProperty('--accent-dark', t.ad);
    root.style.setProperty('--accent-light', t.al);
    root.style.setProperty('--shadow', t.sh);

    // Update immersion info label
    var labels = { green:'豆沙绿', warm:'暖黄纸', sky:'天空蓝', lavender:'淡紫灰', apricot:'暖杏' };
    var infoText = document.querySelector('.immersion-info');
    if (infoText) infoText.innerHTML = '📖 沉浸式阅读 · ' + (labels[themeKey] || '豆沙绿');

    showToast('🎨 已切换为 ' + (labels[themeKey] || '') + ' 主题');
  }

  themeSelect.addEventListener('change', function() {
    applyTheme(this.value);
  });

  // ===== 快捷键 =====
  function handleKeyboard(e) {
    if ((e.ctrlKey || e.metaKey) &amp;&amp; e.shiftKey &amp;&amp; (e.key === 'i' || e.key === 'I')) {
      e.preventDefault();
      if (isImmersion) exitImmersion(); else enterImmersion();
    }
    if (e.key === 'Escape') {
      if (mermaidModal.classList.contains('active')) { closeMermaidFullscreen(); e.preventDefault(); return; }
      if (isImmersion) { exitImmersion(); e.preventDefault(); }
    }
  }

  function handleWheelZoom(e) {
    if (!isImmersion) return;
    if (mermaidModal.classList.contains('active')) return;
    if (!(e.ctrlKey || e.metaKey)) return;
    e.preventDefault();

    var rect = immersionContent.getBoundingClientRect();
    var mouseX = e.clientX - rect.left;
    var mouseY = e.clientY - rect.top;
    mouseX = Math.max(0, Math.min(rect.width, mouseX));
    mouseY = Math.max(0, Math.min(rect.height, mouseY));

    var delta = e.deltaY &gt; 0 ? -10 : 10;
    var newLevel = Math.min(200, Math.max(50, zoomLevel + delta));
    applyZoom(newLevel, mouseX, mouseY);
    showZoomFlash(zoomLevel);
  }

  // ===== 事件绑定 =====
  editor.addEventListener('input', debouncedUpdate);

  immersionBtn.addEventListener('click', enterImmersion);
  previewImmersionBtn.addEventListener('click', enterImmersion);

  zoomInBtn.addEventListener('click', zoomIn);
  zoomOutBtn.addEventListener('click', zoomOut);
  zoomResetBtn.addEventListener('click', zoomReset);

  // loadSampleBtn.addEventListener('click', loadSample);
  // clearBtn.addEventListener('click', clearContent);

  document.addEventListener('keydown', handleKeyboard);
  // Ctrl+鼠标右键 快速进入沉浸阅读
  document.addEventListener('contextmenu', function(e) {
    if (e.ctrlKey || e.metaKey) {
      e.preventDefault();
      if (isImmersion) { exitImmersion(); } else { enterImmersion(); }
    }
  });

  document.addEventListener('wheel', handleWheelZoom, { passive: false });

  immersionContent.addEventListener('scroll', updateImmersionProgress);
  scrollTopBtn.addEventListener('click', scrollToTop);
  immersionContentExit.addEventListener('click', exitImmersion);

  // ===== 代码块复制功能 =====
  document.addEventListener('click', function(e) {
    // 代码块复制
    var copyBtn = e.target.closest('.code-copy-btn');
    if (copyBtn) {
      var wrapper = copyBtn.closest('.code-block-wrapper');
      var codeEl = wrapper.querySelector('code');
      var codeText = codeEl.textContent;
      navigator.clipboard.writeText(codeText).then(function() {
        copyBtn.classList.add('copied');
        copyBtn.textContent = '✅';
        showToast('📋 代码已复制');
        setTimeout(function() {
          copyBtn.classList.remove('copied');
          copyBtn.textContent = '📋';
        }, 1500);
      }).catch(function(err) {
        console.warn('Copy failed:', err);
        showToast('⚠️ 复制失败');
      });
    }

    // 行内代码复制
    var inlineWrapper = e.target.closest('.inline-code-wrapper');
    if (inlineWrapper) {
      var codeText = inlineWrapper.getAttribute('data-inline-code');
      navigator.clipboard.writeText(codeText).then(function() {
        showToast('📋 已复制');
      }).catch(function(err) {
        console.warn('Copy failed:', err);
        showToast('⚠️ 复制失败');
      });
    }

    var mermaidBtn = e.target.closest('.mermaid-fullscreen-btn');
    if (mermaidBtn) {
      var targetId = mermaidBtn.dataset.mermaidTarget;
      if (targetId) openMermaidFullscreen(targetId);
    }
  });

  mermaidModalClose.addEventListener('click', closeMermaidFullscreen);
  mermaidModal.addEventListener('click', function(e) {
    if (e.target === mermaidModal) closeMermaidFullscreen();
  });

  // ===== 初始化 =====
  function init() {
    editor.value = '# ✍️ 开始输入 Markdown…\n\n在左侧编辑器中输入内容，右侧会实时渲染预览。\n\n支持 **粗体**、*斜体*、`代码`、表格、Mermaid 图表等语法。';
    updatePreview();
  }

  init();
})();
