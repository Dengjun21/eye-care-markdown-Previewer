<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EyeCare Markdown Previewer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Marked.js for Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Mermaid.js for Diagrams -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <!-- Highlight.js for Code Syntax -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="hljs-theme">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <style>
        /* Theme Variables */
        :root {
            --theme-bg: #fbf7f0;
            --theme-editor-bg: #f4eee0;
            --theme-text: #433422;
            --theme-border: #e6dac3;
            --theme-panel: #f7f1e5;
            --theme-accent: #c26d38;
            --theme-code-bg: #efe6d5;
            --font-family: 'Inter', sans-serif;
        }

        /* Eye Care Theme Classes */
        body.theme-sepia {
            --theme-bg: #faf4e8;
            --theme-editor-bg: #f2e8d5;
            --theme-text: #433422;
            --theme-border: #e2d3ba;
            --theme-panel: #ede1cb;
            --theme-accent: #b85b24;
            --theme-code-bg: #e8dbcf;
        }

        body.theme-cream {
            --theme-bg: #fdfbf7;
            --theme-editor-bg: #f5f2eb;
            --theme-text: #2d3748;
            --theme-border: #e2e8f0;
            --theme-panel: #f8f6f0;
            --theme-accent: #4a5568;
            --theme-code-bg: #edf2f7;
        }

        body.theme-sage {
            --theme-bg: #f2f5f3;
            --theme-editor-bg: #e4ece7;
            --theme-text: #2c3a35;
            --theme-border: #ccd8d1;
            --theme-panel: #dbe4df;
            --theme-accent: #3b6e58;
            --theme-code-bg: #d7e2dc;
        }

        body.theme-soft-dark {
            --theme-bg: #222629;
            --theme-editor-bg: #1b1e20;
            --theme-text: #b8c0c2;
            --theme-border: #333a3e;
            --theme-panel: #2a2f33;
            --theme-accent: #689d6a;
            --theme-code-bg: #181a1b;
        }

        body.theme-midnight {
            --theme-bg: #141821;
            --theme-editor-bg: #0d1017;
            --theme-text: #9aa5ce;
            --theme-border: #1f2738;
            --theme-panel: #181e2b;
            --theme-accent: #7aa2f7;
            --theme-code-bg: #0b0e14;
        }

        /* Apply theme dynamic colors */
        body {
            background-color: var(--theme-bg);
            color: var(--theme-text);
            font-family: var(--font-family);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .bg-theme-main { background-color: var(--theme-bg); }
        .bg-theme-editor { background-color: var(--theme-editor-bg); }
        .bg-theme-panel { background-color: var(--theme-panel); }
        .border-theme { border-color: var(--theme-border); }
        .text-theme-main { color: var(--theme-text); }
        .text-theme-accent { color: var(--theme-accent); }

        /* Warm Filter Overlay */
        #warm-light-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
            background-color: rgba(255, 170, 0, 0);
            mix-blend-mode: multiply;
            transition: background-color 0.2s ease;
        }

        /* Typography selections */
        .font-sans-custom { font-family: 'Inter', system-ui, sans-serif; }
        .font-serif-custom { font-family: 'Lora', Georgia, serif; }
        .font-mono-custom { font-family: 'JetBrains Mono', monospace; }
        .font-dyslexic-custom { font-family: 'Atkinson Hyperlegible', sans-serif; }

        /* Markdown Styles */
        .markdown-body {
            font-family: inherit;
            color: inherit;
            line-height: var(--preview-line-height, 1.7);
            font-size: var(--preview-font-size, 16px);
        }

        .markdown-body h1, .markdown-body h2, .markdown-body h3, 
        .markdown-body h4, .markdown-body h5, .markdown-body h6 {
            font-weight: 700;
            margin-top: 1.5em;
            margin-bottom: 0.6em;
            line-height: 1.25;
            color: var(--theme-text);
            border-bottom: 1px solid var(--theme-border);
            padding-bottom: 0.3em;
        }

        .markdown-body h1 { font-size: 2em; }
        .markdown-body h2 { font-size: 1.5em; }
        .markdown-body h3 { font-size: 1.25em; }

        .markdown-body p {
            margin-bottom: var(--preview-para-spacing, 1.25em);
        }

        .markdown-body a {
            color: var(--theme-accent);
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .markdown-body ul, .markdown-body ol {
            padding-left: 1.75em;
            margin-bottom: 1.25em;
        }
        .markdown-body ul { list-style-type: disc; }
        .markdown-body ol { list-style-type: decimal; }

        .markdown-body blockquote {
            border-left: 4px solid var(--theme-accent);
            padding-left: 1em;
            margin-left: 0;
            margin-right: 0;
            margin-bottom: 1.25em;
            opacity: 0.85;
            font-style: italic;
        }

        .markdown-body code:not(pre code) {
            background-color: var(--theme-code-bg);
            padding: 0.2em 0.4em;
            border-radius: 4px;
            font-size: 0.9em;
            font-family: 'JetBrains Mono', monospace;
        }

        .markdown-body pre {
            background-color: var(--theme-code-bg);
            padding: 1em;
            border-radius: 8px;
            overflow-x: auto;
            margin-bottom: 1.25em;
            border: 1px solid var(--theme-border);
        }

        .markdown-body table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1.25em;
        }

        .markdown-body th, .markdown-body td {
            border: 1px solid var(--theme-border);
            padding: 0.6em 0.8em;
            text-align: left;
        }

        .markdown-body th {
            background-color: var(--theme-panel);
            font-weight: 600;
        }

        .markdown-body hr {
            border: 0;
            height: 1px;
            background: var(--theme-border);
            margin: 2em 0;
        }

        /* Mermaid wrapper styling */
        .mermaid-container {
            display: flex;
            justify-content: center;
            background: var(--theme-panel);
            padding: 1.25rem;
            border-radius: 8px;
            border: 1px solid var(--theme-border);
            margin: 1.5rem 0;
            overflow-x: auto;
        }

        /* Zoom scale container */
        #preview-content {
            transform-origin: top left;
            transition: transform 0.15s ease-out;
        }

        /* Immersion Mode Styling */
        body.immersion-mode #app-header,
        body.immersion-mode #editor-pane,
        body.immersion-mode #status-bar,
        body.immersion-mode #resizer {
            display: none !important;
        }

        body.immersion-mode #preview-pane {
            width: 100vw !important;
            height: 100vh !important;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 50;
            padding: 3rem 15vw !important;
            overflow-y: auto;
        }

        @media (max-width: 768px) {
            body.immersion-mode #preview-pane {
                padding: 1.5rem 1rem !important;
            }
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--theme-bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--theme-border);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--theme-accent);
        }
    </style>
</head>
<body class="theme-sepia h-full flex flex-col antialiased font-sans-custom select-none">

    <!-- Warm Light / Eye Protection Overlay -->
    <div id="warm-light-overlay"></div>

    <!-- Top Header / Controls -->
    <header id="app-header" class="bg-theme-panel border-b border-theme px-4 py-2 flex flex-wrap items-center justify-between gap-2 shadow-sm text-sm">
        <!-- Logo & Title -->
        <div class="flex items-center gap-2 font-semibold text-theme-accent">
            <i data-lucide="eye" class="w-5 h-5"></i>
            <span class="tracking-wide hidden sm:inline">EyeCare Markdown</span>
        </div>

        <!-- Controls Toolbar -->
        <div class="flex flex-wrap items-center gap-3">
            <!-- Theme Selector -->
            <div class="flex items-center gap-1.5 bg-theme-main px-2 py-1 rounded-lg border border-theme">
                <i data-lucide="palette" class="w-4 h-4 opacity-70"></i>
                <select id="theme-select" class="bg-transparent focus:outline-none text-xs font-medium cursor-pointer">
                    <option value="theme-sepia">Warm Sepia</option>
                    <option value="theme-cream">Cream Light</option>
                    <option value="theme-sage">Sage Green</option>
                    <option value="theme-soft-dark">Soft Dark</option>
                    <option value="theme-midnight">Midnight Low-Contrast</option>
                </select>
            </div>

            <!-- Warm Overlay Filter Toggle & Intensity -->
            <div class="flex items-center gap-2 bg-theme-main px-2.5 py-1 rounded-lg border border-theme" title="Warm Blue-Light Filter">
                <i data-lucide="sun" class="w-4 h-4 text-amber-600"></i>
                <input type="range" id="warm-slider" min="0" max="0.35" step="0.02" value="0.08" class="w-16 h-1 bg-amber-200 rounded-lg appearance-none cursor-pointer accent-amber-600">
            </div>

            <!-- Typography Settings Dropdown -->
            <div class="relative inline-block text-left">
                <button id="typo-menu-btn" class="flex items-center gap-1 bg-theme-main px-2.5 py-1 rounded-lg border border-theme hover:border-amber-500 text-xs font-medium">
                    <i data-lucide="type" class="w-4 h-4 opacity-70"></i>
                    <span>Font</span>
                    <i data-lucide="chevron-down" class="w-3 h-3 opacity-50"></i>
                </button>
                <!-- Dropdown Menu -->
                <div id="typo-menu" class="hidden absolute right-0 mt-2 w-56 bg-theme-panel border border-theme rounded-xl shadow-xl z-50 p-3 text-xs space-y-3">
                    <div>
                        <label class="block font-semibold mb-1 opacity-80">Font Family</label>
                        <select id="font-family-select" class="w-full bg-theme-main border border-theme rounded p-1 focus:outline-none">
                            <option value="font-sans-custom">Sans-Serif (Inter)</option>
                            <option value="font-serif-custom">Serif (Lora)</option>
                            <option value="font-mono-custom">Monospace (JetBrains)</option>
                            <option value="font-dyslexic-custom">Dyslexic Friendly (Atkinson)</option>
                        </select>
                    </div>
                    <div>
                        <div class="flex justify-between mb-1">
                            <span class="font-semibold opacity-80">Font Size</span>
                            <span id="font-size-val">16px</span>
                        </div>
                        <input type="range" id="font-size-slider" min="12" max="24" value="16" class="w-full h-1 bg-neutral-300 rounded appearance-none cursor-pointer">
                    </div>
                    <div>
                        <div class="flex justify-between mb-1">
                            <span class="font-semibold opacity-80">Line Height</span>
                            <span id="line-height-val">1.7</span>
                        </div>
                        <input type="range" id="line-height-slider" min="1.2" max="2.4" step="0.1" value="1.7" class="w-full h-1 bg-neutral-300 rounded appearance-none cursor-pointer">
                    </div>
                </div>
            </div>

            <div class="h-4 w-px bg-theme-border"></div>

            <!-- Zoom Controls -->
            <div class="flex items-center bg-theme-main border border-theme rounded-lg overflow-hidden text-xs">
                <button id="btn-zoom-out" class="px-2 py-1 hover:bg-theme-panel transition border-r border-theme" title="Zoom Out (Ctrl + Scroll Down)">
                    <i data-lucide="zoom-out" class="w-3.5 h-3.5"></i>
                </button>
                <span id="zoom-val" class="px-2 font-mono font-medium min-w-[3rem] text-center">100%</span>
                <button id="btn-zoom-in" class="px-2 py-1 hover:bg-theme-panel transition border-l border-theme" title="Zoom In (Ctrl + Scroll Up)">
                    <i data-lucide="zoom-in" class="w-3.5 h-3.5"></i>
                </button>
                <button id="btn-zoom-reset" class="px-2 py-1 hover:bg-theme-panel transition border-l border-theme opacity-70" title="Reset Zoom">
                    <i data-lucide="rotate-ccw" class="w-3 h-3"></i>
                </button>
            </div>

            <!-- Immersion Reading Mode Trigger -->
            <button id="btn-immersion" class="flex items-center gap-1.5 bg-theme-accent text-white px-3 py-1 rounded-lg hover:opacity-90 transition text-xs font-medium shadow-sm">
                <i data-lucide="maximize-2" class="w-3.5 h-3.5"></i>
                <span class="hidden md:inline">Focus Reading</span>
            </button>

            <!-- Export Menu -->
            <div class="relative inline-block text-left">
                <button id="export-menu-btn" class="flex items-center gap-1 bg-theme-main px-2.5 py-1 rounded-lg border border-theme hover:border-amber-500 text-xs font-medium">
                    <i data-lucide="download" class="w-4 h-4 opacity-70"></i>
                    <span>Export</span>
                </button>
                <div id="export-menu" class="hidden absolute right-0 mt-2 w-40 bg-theme-panel border border-theme rounded-xl shadow-xl z-50 py-1 text-xs">
                    <button id="export-md" class="w-full text-left px-3 py-2 hover:bg-theme-main flex items-center gap-2">
                        <i data-lucide="file-text" class="w-3.5 h-3.5"></i> Save Markdown
                    </button>
                    <button id="export-html" class="w-full text-left px-3 py-2 hover:bg-theme-main flex items-center gap-2">
                        <i data-lucide="code" class="w-3.5 h-3.5"></i> Save HTML
                    </button>
                    <button id="export-print" class="w-full text-left px-3 py-2 hover:bg-theme-main flex items-center gap-2">
                        <i data-lucide="printer" class="w-3.5 h-3.5"></i> Print / PDF
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Split Screen -->
    <main class="flex-1 flex overflow-hidden relative">
        
        <!-- Editor Pane -->
        <section id="editor-pane" class="w-1/2 flex flex-col border-r border-theme bg-theme-editor min-w-[200px] transition-all duration-75">
            <div class="px-3 py-1.5 bg-theme-panel border-b border-theme flex justify-between items-center text-xs opacity-80 font-medium">
                <span class="flex items-center gap-1.5">
                    <i data-lucide="edit-3" class="w-3.5 h-3.5"></i> Editor
                </span>
                <button id="btn-toggle-editor" class="hover:text-amber-600" title="Collapse Editor">
                    <i data-lucide="panel-left-close" class="w-4 h-4"></i>
                </button>
            </div>
            <textarea id="markdown-input" class="flex-1 w-full p-4 bg-transparent resize-none focus:outline-none font-mono-custom text-sm leading-relaxed border-none text-theme-main select-text" placeholder="Type Markdown here..."></textarea>
        </section>

        <!-- Divider Resizer -->
        <div id="resizer" class="w-1 bg-theme-border hover:bg-amber-500 cursor-col-resize transition-colors z-10 hidden md:block"></div>

        <!-- Preview Pane -->
        <section id="preview-pane" class="flex-1 flex flex-col bg-theme-main overflow-y-auto relative select-text">
            <!-- Tip Banner -->
            <div id="immersion-tip" class="bg-theme-panel/70 border-b border-theme px-3 py-1 text-[11px] text-center opacity-75 flex items-center justify-center gap-1.5">
                <i data-lucide="info" class="w-3 h-3 text-amber-600"></i>
                <span>Tip: <b>Ctrl + Right-Click</b> anywhere on the preview pane for Immersion Reading Mode</span>
            </div>

            <!-- Preview Render Wrapper -->
            <div class="p-6 md:p-10 flex-1">
                <div id="preview-content" class="markdown-body max-w-3xl mx-auto"></div>
            </div>

            <!-- Floating Immersion Close Button -->
            <button id="btn-exit-immersion" class="hidden fixed top-6 right-6 bg-theme-panel border border-theme text-theme-main hover:bg-amber-600 hover:text-white px-4 py-2 rounded-full shadow-2xl flex items-center gap-2 text-xs font-semibold z-50 transition-all">
                <i data-lucide="x" class="w-4 h-4"></i>
                <span>Exit Immersion (Esc)</span>
            </button>
        </section>
    </main>

    <!-- Footer / Status Bar -->
    <footer id="status-bar" class="bg-theme-panel border-t border-theme px-4 py-1.5 flex justify-between items-center text-xs opacity-80">
        <div class="flex items-center gap-4">
            <span id="stat-words">0 words</span>
            <span id="stat-chars">0 characters</span>
            <span id="stat-reading-time">1 min read</span>
        </div>
        <div class="flex items-center gap-2">
            <span class="inline-block w-2 h-2 rounded-full bg-emerald-500"></span>
            <span>Live Syncing</span>
        </div>
    </footer>

    <script>
        // Default Sample Markdown Document
        const sampleMarkdown = `# 🌿 Welcome to EyeCare Markdown

An eye-friendly, low-strain Markdown previewer designed for comfortable reading, study, and long typing sessions.

---

## 👁️ Key Eye Care Features

- **Soft Color Palettes**: Toggle between Warm Sepia, Soft Dark, Sage, and Midnight themes.
- **Blue Light Warm Filter**: Fine-tune warm light intensity with the top slider.
- **Immersion Focus Mode**: Simply **Ctrl + Right-Click** anywhere on the right preview pane!
- **Zoom Controls**: Easily zoom preview text in/out using top toolbar controls or **Ctrl + Mouse Wheel**.

---

## 📊 Mermaid Diagram Support

You can create interactive diagrams seamlessly using code blocks:

\`\`\`mermaid
flowchart TD
    A[Start Reading] --> B{Eye Strain?}
    B -- Yes --> C[Switch to Warm Sepia / Soft Dark]
    B -- No --> D[Enable Immersion Mode]
    C --> D
    D --> E[Enjoy Relaxed Reading ☕]
\`\`\`

---

## 📝 Code Syntax Highlighting

\`\`\`javascript
// Quick JavaScript snippet
function calculateReadingComfort(darkTheme, warmFilterLevel) {
    const eyeStrain = 100 - (darkTheme ? 40 : 20) - (warmFilterLevel * 100);
    return eyeStrain < 30 ? "Optimal Eye Comfort 🌿" : "Adjust Lighting";
}

console.log(calculateReadingComfort(true, 0.15));
\`\`\`

---

## 📑 Detailed Table Example

| Theme Option | Ideal Environment | Eye Protection Rating |
| :--- | :--- | :---: |
| **Warm Sepia** | Warm Indoor Lighting | ⭐⭐⭐⭐⭐ |
| **Sage Green** | Natural Daylight | ⭐⭐⭐⭐ |
| **Soft Dark** | Low-Light Rooms | ⭐⭐⭐⭐⭐ |
| **Midnight** | Nighttime Reading | ⭐⭐⭐⭐⭐ |

> *"Protecting your eyes today ensures clear vision tomorrow. Take breaks every 20 minutes!"*
`;

        // State variables
        let currentZoom = 1.0;
        let isImmersion = false;

        // Initialize Mermaid
        mermaid.initialize({
            startOnLoad: false,
            theme: 'neutral',
            securityLevel: 'loose'
        });

        // DOM Element References
        const markdownInput = document.getElementById('markdown-input');
        const previewContent = document.getElementById('preview-content');
        const themeSelect = document.getElementById('theme-select');
        const warmSlider = document.getElementById('warm-slider');
        const warmOverlay = document.getElementById('warm-light-overlay');
        const fontSelect = document.getElementById('font-family-select');
        const fontSizeSlider = document.getElementById('font-size-slider');
        const fontSizeVal = document.getElementById('font-size-val');
        const lineHeightSlider = document.getElementById('line-height-slider');
        const lineHeightVal = document.getElementById('line-height-val');
        const zoomVal = document.getElementById('zoom-val');
        const previewPane = document.getElementById('preview-pane');
        const editorPane = document.getElementById('editor-pane');
        const btnToggleEditor = document.getElementById('btn-toggle-editor');
        const btnImmersion = document.getElementById('btn-immersion');
        const btnExitImmersion = document.getElementById('btn-exit-immersion');

        // Render Markdown to Preview
        async function renderMarkdown() {
            const rawText = markdownInput.value;
            
            // Configure Marked options
            marked.setOptions({
                highlight: function(code, lang) {
                    if (lang && hljs.getLanguage(lang)) {
                        try {
                            return hljs.highlight(code, { language: lang }).value;
                        } catch (e) {}
                    }
                    return hljs.highlightAuto(code).value;
                },
                breaks: true
            });

            // Parse Markdown
            let parsedHtml = marked.parse(rawText);
            previewContent.innerHTML = parsedHtml;

            // Render Mermaid Diagrams
            const mermaidBlocks = previewContent.querySelectorAll('pre code.language-mermaid');
            for (let i = 0; i < mermaidBlocks.length; i++) {
                const block = mermaidBlocks[i];
                const pre = block.parentElement;
                const code = block.textContent;
                
                const container = document.createElement('div');
                container.className = 'mermaid-container';
                const id = `mermaid-svg-${Date.now()}-${i}`;
                
                try {
                    const { svg } = await mermaid.render(id, code);
                    container.innerHTML = svg;
                    pre.replaceWith(container);
                } catch (err) {
                    container.innerHTML = `<pre class="text-red-500 text-xs p-2">Mermaid Diagram Error</pre>`;
                    pre.replaceWith(container);
                }
            }

            // Update stats
            updateStats(rawText);
        }

        // Calculate Stats
        function updateStats(text) {
            const words = text.trim() ? text.trim().split(/\s+/).length : 0;
            const chars = text.length;
            const readingTime = Math.max(1, Math.ceil(words / 200));

            document.getElementById('stat-words').textContent = `${words.toLocaleString()} words`;
            document.getElementById('stat-chars').textContent = `${chars.toLocaleString()} characters`;
            document.getElementById('stat-reading-time').textContent = `~${readingTime} min read`;
        }

        // Theme Switcher
        themeSelect.addEventListener('change', (e) => {
            document.body.className = `${e.target.value} h-full flex flex-col antialiased select-none ${fontSelect.value}`;
            
            // Adjust Highlight.js theme dynamically
            const hljsTheme = document.getElementById('hljs-theme');
            if (e.target.value === 'theme-soft-dark' || e.target.value === 'theme-midnight') {
                hljsTheme.href = 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css';
            } else {
                hljsTheme.href = 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css';
            }
            renderMarkdown();
        });

        // Warm Overlay Intensity Slider
        warmSlider.addEventListener('input', (e) => {
            warmOverlay.style.backgroundColor = `rgba(255, 170, 0, ${e.target.value})`;
        });
        warmOverlay.style.backgroundColor = `rgba(255, 170, 0, ${warmSlider.value})`;

        // Typography settings
        fontSelect.addEventListener('change', (e) => {
            document.body.classList.remove('font-sans-custom', 'font-serif-custom', 'font-mono-custom', 'font-dyslexic-custom');
            document.body.classList.add(e.target.value);
        });

        fontSizeSlider.addEventListener('input', (e) => {
            const size = e.target.value;
            fontSizeVal.textContent = `${size}px`;
            document.documentElement.style.setProperty('--preview-font-size', `${size}px`);
        });

        lineHeightSlider.addEventListener('input', (e) => {
            const val = e.target.value;
            lineHeightVal.textContent = val;
            document.documentElement.style.setProperty('--preview-line-height', val);
        });

        // Toggle Menus
        function setupToggleMenu(btnId, menuId) {
            const btn = document.getElementById(btnId);
            const menu = document.getElementById(menuId);
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                menu.classList.toggle('hidden');
            });
            document.addEventListener('click', () => menu.classList.add('hidden'));
            menu.addEventListener('click', (e) => e.stopPropagation());
        }
        setupToggleMenu('typo-menu-btn', 'typo-menu');
        setupToggleMenu('export-menu-btn', 'export-menu');

        // Zoom Functions
        function applyZoom(delta) {
            currentZoom = Math.min(Math.max(0.6, currentZoom + delta), 2.2);
            zoomVal.textContent = `${Math.round(currentZoom * 100)}%`;
            previewContent.style.transform = `scale(${currentZoom})`;
            previewContent.style.width = `${100 / currentZoom}%`;
        }

        document.getElementById('btn-zoom-in').addEventListener('click', () => applyZoom(0.1));
        document.getElementById('btn-zoom-out').addEventListener('click', () => applyZoom(-0.1));
        document.getElementById('btn-zoom-reset').addEventListener('click', () => {
            currentZoom = 1.0;
            zoomVal.textContent = '100%';
            previewContent.style.transform = 'scale(1)';
            previewContent.style.width = '100%';
        });

        // Ctrl + Mouse Wheel Zoom
        previewPane.addEventListener('wheel', (e) => {
            if (e.ctrlKey) {
                e.preventDefault();
                applyZoom(e.deltaY < 0 ? 0.05 : -0.05);
            }
        }, { passive: false });

        // Immersion Focus Mode Setup
        function toggleImmersionMode(enable) {
            isImmersion = enable;
            if (isImmersion) {
                document.body.classList.add('immersion-mode');
                btnExitImmersion.classList.remove('hidden');
            } else {
                document.body.classList.remove('immersion-mode');
                btnExitImmersion.classList.add('hidden');
            }
        }

        // Ctrl + Right Click triggered Immersion Mode
        previewPane.addEventListener('contextmenu', (e) => {
            if (e.ctrlKey) {
                e.preventDefault();
                toggleImmersionMode(true);
            }
        });

        btnImmersion.addEventListener('click', () => toggleImmersionMode(true));
        btnExitImmersion.addEventListener('click', () => toggleImmersionMode(false));

        // Key bindings
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && isImmersion) {
                toggleImmersionMode(false);
            }
        });

        // Collapsible Editor
        let editorCollapsed = false;
        btnToggleEditor.addEventListener('click', () => {
            editorCollapsed = !editorCollapsed;
            if (editorCollapsed) {
                editorPane.classList.add('hidden');
            } else {
                editorPane.classList.remove('hidden');
            }
        });

        // Resizable Split Pane Logic
        const resizer = document.getElementById('resizer');
        let isResizing = false;

        resizer.addEventListener('mousedown', (e) => {
            isResizing = true;
            document.body.style.cursor = 'col-resize';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isResizing) return;
            const containerWidth = document.querySelector('main').clientWidth;
            const newEditorWidth = (e.clientX / containerWidth) * 100;
            if (newEditorWidth > 15 && newEditorWidth < 85) {
                editorPane.style.width = `${newEditorWidth}%`;
            }
        });

        document.addEventListener('mouseup', () => {
            isResizing = false;
            document.body.style.cursor = 'default';
        });

        // Export Functions
        document.getElementById('export-md').addEventListener('click', () => {
            const blob = new Blob([markdownInput.value], { type: 'text/markdown' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'eyecare-document.md';
            a.click();
        });

        document.getElementById('export-html').addEventListener('click', () => {
            const fullHtml = `<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Exported Markdown</title>
<style>
body { font-family: sans-serif; padding: 2rem; max-width: 800px; margin: 0 auto; line-height: 1.6; }
table { border-collapse: collapse; width: 100%; }
th, td { border: 1px solid #ccc; padding: 8px; }
pre { background: #f4f4f4; padding: 1rem; border-radius: 4px; }
</style>
</head>
<body>
${previewContent.innerHTML}
</body>
</html>`;
            const blob = new Blob([fullHtml], { type: 'text/html' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'eyecare-document.html';
            a.click();
        });

        document.getElementById('export-print').addEventListener('click', () => {
            window.print();
        });

        // Live input event listener
        markdownInput.addEventListener('input', renderMarkdown);

        // Initialization
        window.onload = () => {
            markdownInput.value = sampleMarkdown;
            renderMarkdown();
            lucide.createIcons();
        };
    </script>
</body>
</html>
